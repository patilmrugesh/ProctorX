spring.application.name=proctorx-backend
server.port=${PORT:8080}

# --- Database Connection ---
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/proctorx_db
spring.datasource.username=postgres
spring.datasource.password=0000

# --- Hibernate (Auto-Table Creation) ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- App Settings ---
proctorx.code.temp-dir=./temp-execution

#gemini.api.key=${GEMINI_API_KEY}
#gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

# Groq API (Recommended - Fast & Free)
groq.api.key=${GROQ_API_KEY}
